name: Build ModMenu

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          brew install ldid xz
          if [ ! -d ~/theos ]; then
            git clone --recursive https://github.com/theos/theos.git ~/theos
          fi
          if [ ! -d ~/theos/sdks ]; then
            git clone https://github.com/theos/sdks.git ~/theos/sdks
          fi

      - name: Build
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1 CFLAGS="-Wno-error -Wno-nontrivial-memcall -Wno-module-import-in-extern-c" CXXFLAGS="-Wno-error -Wno-nontrivial-memcall -Wno-module-import-in-extern-c"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-Build
          path: packages/
